<script>
(function () {
  const D = DATA, app = document.getElementById("app");
  const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const pill = p => `<span class="pill${p.tone ? " " + esc(p.tone) : ""}">${esc(p.text)}</span>`;
  const img = (u, alt) => /^https:\/\/|^data:image\//.test(u || "") ? `<img src="${esc(u)}" alt="${esc(alt)}" loading="lazy" onerror="this.remove()">` : "";
  const list = (items, tag) => (items || []).map(t => `<li>${pill({ text: tag.text, tone: tag.tone })} ${esc(t)}</li>`).join("");
  const glass = (inner) => `<section class="glass">${inner}</section>`;
  const head = (h, sub) => `<div><h2>${esc(h)}</h2>${sub ? `<p class="sub">${esc(sub)}</p>` : ""}</div>`;
  let h = "";

  h += `<header class="hd">${typeof LOGO === "string" ? LOGO : ""}<div><div class="mn">${esc(D.merchant)}</div><div class="meta">Next Moshi flows · proposal · ${esc(D.date)}</div></div><div class="pl">${(D.pills || []).map(pill).join("")}</div></header>`;
  h += `<section class="hero"><h1>${esc(D.title)}</h1>${D.dek ? `<p class="dek">${esc(D.dek)}</p>` : ""}${D.intro ? `<p>${esc(D.intro)}</p>` : ""}</section>`;

  if ((D.glance || []).length) h += glass(`<h2>At a glance</h2><div class="wb">${D.glance.map(g => `<div${g.muted ? ' class="web"' : ""}><b>${esc(g.value)}</b><span>${esc(g.label)}</span></div>`).join("")}</div>`);

  h += glass(head(`The ${(D.picks || []).length === 1 ? "ad" : (D.picks || []).length + " ads"}`, D.picksSub) + `<div class="adg">${(D.picks || []).map(p => `<div class="card adc">${img(p.thumbnailUrl, p.title)}<h3>${esc(p.title)}</h3><div class="chips">${(p.chips || []).map(pill).join("")}</div><div class="path"><b>Why</b><span>${esc(p.why)}</span></div><div class="path"><b>Flow</b><span>${esc(p.flow)}</span></div>${p.watch ? `<div class="path">${pill({ text: "Watch", tone: "rose" })}<span>${esc(p.watch)}</span></div>` : ""}</div>`).join("")}</div>`);

  (D.tables || []).forEach(t => {
    const rows = (t.rows || []).map(r => `<tr>${r.cells.map((c, i) => {
      let v = esc(c);
      if (i === 1 && r.arm && c) v = pill({ text: c, tone: r.arm === "dm" ? "acc" : "" });
      return `<td>${r.bold && i !== 1 ? `<b>${v}</b>` : v}</td>`;
    }).join("")}</tr>`).join("");
    h += glass(head(t.title, t.sub) + `<div class="tw"><table><thead><tr>${t.columns.map(c => `<th>${esc(c)}</th>`).join("")}</tr></thead><tbody>${rows}</tbody></table></div>${t.note ? `<p class="sub">${esc(t.note)}</p>` : ""}`);
  });

  if ((D.holds || []).length || (D.early || []).length) h += glass(`<h2>What we're confident in</h2><ul class="l">${list(D.holds, { text: "Holds up", tone: "mint" })}${list(D.early, { text: "Too early", tone: "" })}</ul>`);

  if ((D.setup || []).length) h += glass(`<h2>How we'd set up the ad set</h2><div class="tw"><table><thead><tr><th>Setting</th><th>Plan</th></tr></thead><tbody>${D.setup.map(r => `<tr><td>${esc(r[0])}</td><td>${esc(r[1])}</td></tr>`).join("")}</tbody></table></div>`);

  if ((D.decisions || []).length) h += glass(`<h2>Decisions before we build</h2><ul class="l">${D.decisions.map((d, i) => `<li>${pill({ text: String(i + 1), tone: "acc" })} ${esc(d)}</li>`).join("")}</ul>`);

  if ((D.bench || []).length || (D.leftOut || []).length) h += glass(head("On the bench", "Next in line if a pick underdelivers.") + `<div class="adg">${(D.bench || []).map(b => `<div class="card adc">${img(b.thumbnailUrl, b.title)}<h3>${esc(b.title)}</h3><div class="chips">${(b.chips || []).map(pill).join("")}</div><p class="cap">${esc(b.note)}</p></div>`).join("")}</div>${(D.leftOut || []).length ? `<ul class="l">${list(D.leftOut, { text: "Left out", tone: "" })}</ul>` : ""}`);

  h += glass(`<h2>Next step</h2><div class="reach">${esc(D.nextStep)}</div>${D.footer ? `<p class="sub">${esc(D.footer)}</p>` : ""}`);

  app.innerHTML = h;
  document.title = D.merchant + " · Next Moshi Flows";
})();
</script>
</body>
</html>
