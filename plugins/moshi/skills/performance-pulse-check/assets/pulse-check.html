t 50%),radial-gradient(at 80% 50%,var(--m4) 0px,transparent 50%),radial-gradient(at 0% 100%,var(--m5) 0px,transparent 50%),radial-gradient(at 80% 100%,var(--m6) 0px,transparent 50%)}.wrap{max-width:880px;margin:0 auto;padding:20px 16px 56px;display:grid;gap:16px}h1,h2,h3{font-family:var(--hd);margin:0;letter-spacing:-.01em;text-wrap:balance}h1{font-size:clamp(26px,5vw,38px);line-height:1.12;font-weight:700}h2{font-size:19px;font-weight:650}h3{font-size:15px;font-weight:600}p{margin:0}.num,.bar .v{font-family:var(--mono);font-variant-numeric:tabular-nums}.tv{font-variant-numeric:tabular-nums}.glass{border-radius:var(--r-lg);padding:20px;display:grid;gap:14px;min-width:0;background:color-mix(in oklab,var(--surface) 48%,transparent);border:1px solid color-mix(in oklab,var(--border-strong) 55%,transparent);box-shadow:inset 0 1px color-mix(in oklab,var(--surface) 95%,transparent),0 1px 2px color-mix(in oklab,var(--text) 5%,transparent),0 6px 28px color-mix(in oklab,var(--text) 7%,transparent),0 20px 64px color-mix(in oklab,var(--accent-strong) 9%,transparent);-webkit-backdrop-filter:blur(28px) saturate(150%);backdrop-filter:blur(28px) saturate(150%)}.card{border-radius:var(--r);border:1px solid var(--border-strong);background:var(--surface);box-shadow:var(--shadow)}.pill{display:inline-flex;align-items:center;gap:4px;border-radius:var(--r-pill);padding:3px 8px;font:500 11px/1.25 Geist,sans-serif;background:var(--surface-2);color:var(--text-2);white-space:nowrap;vertical-align:middle}.pill.mint{background:var(--mint-soft);color:var(--mint-strong)}.pill.acc{background:var(--accent-soft);color:var(--accent-strong)}.pill.rose{background:var(--rose-soft);color:var(--rose)}.sub,.ts,.meta,.rn,small,.tl{color:var(--text-2);font-size:13px}.hd{display:flex;flex-wrap:wrap;align-items:center;gap:10px 12px}.hd .mn{font:600 15px/1.2 var(--hd)}.hd .pl{display:flex;flex-wrap:wrap;gap:6px;margin-left:auto}.hero{display:grid;grid-template-columns:auto 1fr;gap:16px;align-items:start;paddin 2)}.cvr{display:flex;gap:14px;align-items:center}.cvr>b{font:700 34px/1 var(--hd)}.cvr small{display:block}.cbtn{justify-self:start;padding:10px 16px;border-radius:var(--r-pill);background:var(--primary);color:#fff;font-weight:600;text-decoration:none}.tw{overflow-x:auto}table{width:100%;border-collapse:collapse;font-size:13px}th,td{text-align:left;padding:7px 8px;border-bottom:1px solid var(--border);vertical-align:top}th{color:var(--text-2);font-weight:500}.nocv canvas.dv{display:none}.ban{border-radius:var(--r-lg);padding:14px 16px;background:var(--rose-soft);color:var(--text);border:1px solid var(--rose)}.ban ul{margin:6px 0 0;padding-left:18px;font-size:14px}.hero p.sub{font-size:13px}.ov{display:grid;gap:10px}:focus-visible{outline:2px solid var(--primary);outline-offset:2px;border-radius:4px}@media(max-width:560px){.bar{grid-template-columns:minmax(0,1fr) 6.5rem}.bar .cw{grid-column:1/-1;grid-row:2}.whr{grid-template-columns:minmax(0,1fr) 3.5rem 4.5rem 30px;gap:6px}.hero{grid-template-columns:1fr}.st{grid-template-columns:minmax(0,1fr)}.stl{padding-top:0}.hd .pl{margin-left:0}.glass{padding:16px}}</style>
