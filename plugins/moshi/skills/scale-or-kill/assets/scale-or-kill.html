<script>
const DATA = {
  merchant: "Example Co",
  date: "2026-11-03",
  window: { from: "2026-10-03", to: "2026-11-01" },
  currency: "USD",
  target: { cpa: 50, source: "merchant" },
  bumpPct: 15,
  summary: "Two ads have earned more budget and two should go today. Most of the account is still in test, so keep spending there and watch how each ad moves.",
  notes: [
    "CPA uses Meta-attributed purchases from all customers. Moshi can't split out new customers, so this is blended CPA, not new-customer CPA."
  ],
  ads: [
    { id: "1", name: "Before/after UGC v1", campaign: "Prospecting | Broad", owner: "merchant", status: "ACTIVE", spend: 4200, reach: 61000, purchases: 120 },
    { id: "2", name: "Founder story 30s", campaign: "Prospecting | Broad", owner: "merchant", status: "ACTIVE", spend: 2600, reach: 52000, purchases: 65 },
    { id: "3", name: "Review static 3", campaign: "Prospecting | Broad", owner: "merchant", status: "ACTIVE", spend: 1900, reach: 21000, purchases: 30 },
    { id: "4", name: "Unboxing reel", campaign: "ASC", owner: "merchant", status: "ACTIVE", spend: 2100, reach: 70000, purchases: 38 },
    { id: "5", name: "Ingredient carousel", campaign: "ASC", owner: "merchant", status: "ACTIVE", spend: 1800, reach: 16000, purchases: 30 },
    { id: "6", name: "Meme static", campaign: "ASC", owner: "merchant", status: "ACTIVE", spend: 220, reach: 6100, purchases: 3 },
    { id: "7", name: "Moshi DM: Quiz", campaign: "Moshi DM", owner: "moshi", status: "ACTIVE", spend: 600, reach: 14000, purchases: 4 },
    { id: "8", name: "Lifestyle v4", campaign: "Prospecting | Broad", owner: "merchant", status: "ACTIVE", spend: 140, reach: 3000, purchases: 0 },
    { id: "9", name: "Creator try-on", campaign: "ASC", owner: "merchant", status: "ACTIVE", spend: 1100, reach: 50000, purchases: 16 },
    { id: "10", name: "Holiday teaser", campaign: "ASC", owner: "merchant", status: "PAUSED", spend: 300, reach: 5200, purchases: 1 }
  ]
};

<script>
(function () {
  const D = DATA, app = document.getElementById("app");
  const T0 = +D.target.cpa, BUMP = (+D.bumpPct || 15) / 100;
  let T = T0, sel = null, pick = null;
  const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  let fmt; try { fmt = new Intl.NumberFormat("en-US", { style: "currency", currency: D.currency || "USD", maximumFractionDigits: 0 }); } catch (e) { fmt = { format: v => Math.round(v) + " " + (D.currency || "") }; }
  const money = v => v == null || !isFinite(v) ? "—" : fmt.format(v);
  const kmoney = v => v >= 1000 ? money(v / 1000).replace(/(\.0+)?$/, "") + "K" : money(v);
  const num = v => Math.round(v).toLocaleString("en-US");

  // 10% / 90% quantiles of Gamma(k + 0.5, 1): the Jeffreys posterior on purchases per dollar, times target CPA.
  // Kill when P(true CPA > target) >= 90%: spend/target >= KILL[k]. Scale when P(true CPA < target) >= 90%: spend/target <= SCALE[k].
  const SCALE = [0.008,0.292,0.805,1.417,2.084,2.789,3.521,4.273,5.043,5.825,6.62,7.424,8.237,9.057,9.884,10.717,11.555,12.398,13.246,14.098,14.954,15.813,16.675,17.541,18.409,19.28,20.154,21.03,21.908,22.788,23.671,24.555,25.441,26.329,27.219,28.11,29.003,29.897,30.793,31.69,32.588];
  const KILL = [1.353,3.126,4.618,6.009,7.342,8.638,9.906,11.154,12.385,13.602,14.808,16.003,17.191,18.371,19.544,20.711,21.873,23.029,24.182,25.33,26.474,27.615,28.753,29.887,31.019,32.148,33.274,34.398,35.52,36.639,37.757,38.873,39.987,41.099,42.209,43.318,44.425,45.531,46.635,47.738,48.84];
  const qS = k => k <= 40 ? SCALE[k] : k + 0.7 - 1.2816 * Math.sqrt(k + 0.5);
  const qK = k => k <= 40 ? KILL[k] : k + 0.7 + 1.2816 * Math.sqrt(k + 0.5);
  // Scale also needs at least MIN_SCALE purchases: one lucky sale on tiny spend is not a reason to raise a budget.
  const MIN_SCALE = 3;
  const zoneAt = (spend, k, t) => { const e = spend / t; return e >= qK(k) ? "kill" : (k >= MIN_SCALE && e <= qS(k)) ? "scale" : "test"; };

  // Target-independent facts about each ad.
  const ads = (D.ads || []).filter(a => +a.spend > 0).map((a, i) => {
    const k = Math.max(0, Math.floor(+a.purchases || 0)), spend = +a.spend, reach = +a.reach || 0;
    return { ...a, i: i + 1, k, spend, reach, cpa: k > 0 ? spend / k : null, cpmr: reach > 0 ? spend / reach * 1000 : null, live: String(a.status || "").toUpperCase() === "ACTIVE" };
  });
  const median = xs => { const s = xs.slice().sort((a, b) => a - b), m = s.length >> 1; return s.length ? (s.length % 2 ? s[m] : (s[m - 1] + s[m]) / 2) : null; };
  const grouped = ads.filter(a => a.cpa != null && a.cpmr != null);
  const mCpmr = median(grouped.map(a => a.cpmr)), mCpa = median(grouped.map(a => a.cpa));
  const GROUP = { eff: "Efficient growth", reach: "Reach play", prec: "Precision", kc: "Kill candidate" };
  const GSUB = { eff: "cheap reach, lower CPA", reach: "cheap reach, higher CPA", prec: "pricey reach, lower CPA", kc: "pricey reach, higher CPA" };
  ads.forEach(a => { a.group = a.cpa == null || a.cpmr == null ? null : a.cpmr <= mCpmr ? (a.cpa <= mCpa ? "eff" : "reach") : (a.cpa <= mCpa ? "prec" : "kc"); });
  const allSpend = ads.reduce((s, a) => s + a.spend, 0);

  // Ad set delivery settings (optional DATA.adsets). Meta only returns them for Moshi ad sets and merchant ad sets
  // it reports ACTIVE, so a missing value means "not read", never "none".
  const AS = {}; (D.adsets || []).forEach(x => { AS[x.adsetId] = x; });
  const title = v => String(v).toLowerCase().replace(/_/g, " ").replace(/^\w/, c => c.toUpperCase());
  const OBJ = { OUTCOME_SALES: "Sales", OUTCOME_LEADS: "Leads", OUTCOME_TRAFFIC: "Traffic", OUTCOME_ENGAGEMENT: "Engagement", OUTCOME_AWARENESS: "Awareness", OUTCOME_APP_PROMOTION: "App promotion", CONVERSIONS: "Conversions" };
  const GOAL = { OFFSITE_CONVERSIONS: "Website conversions", CONVERSATIONS: "Conversations", LINK_CLICKS: "Link clicks", LANDING_PAGE_VIEWS: "Landing page views", VALUE: "Purchase value", REACH: "Reach", IMPRESSIONS: "Impressions", LEAD_GENERATION: "Leads", QUALITY_LEAD: "Quality leads" };
  const BID = { LOWEST_COST_WITHOUT_CAP: "Lowest cost", LOWEST_COST_WITH_BID_CAP: "Bid cap", COST_CAP: "Cost cap", LOWEST_COST_WITH_MIN_ROAS: "Min ROAS" };
  const ATT = { CLICK_THROUGH: "click", VIEW_THROUGH: "view", ENGAGED_VIDEO_VIEW: "engaged view" };
  const LRN = { SUCCESS: "Out of learning", LEARNING: "Learning", FAIL: "Learning limited" };
  const minor = v => v == null || v === "" ? null : money(+v / 100);
  const setup = x => {
    if (!x) return null;
    return {
      objective: x.objective ? (OBJ[x.objective] || title(x.objective)) : null,
      goal: x.optimizationGoal ? (GOAL[x.optimizationGoal] || title(x.optimizationGoal)) : null,
      attribution: Array.isArray(x.attributionSpec) && x.attributionSpec.length ? x.attributionSpec.map(a => `${a.windowDays}d ${ATT[a.eventType] || title(a.eventType)}`).join(", ") : null,
      bid: x.bidStrategy ? (BID[x.bidStrategy] || title(x.bidStrategy)) : null,
      budget: x.dailyBudget ? `${minor(x.dailyBudget)}/day ad set` : x.campaignDailyBudget ? `${minor(x.campaignDailyBudget)}/day campaign` : null,
      learning: x.learningPhase && x.learningPhase.status ? (LRN[x.learningPhase.status] || title(x.learningPhase.status)) + (x.learningPhase.status !== "SUCCESS" && x.learningPhase.conversions != null ? ` (${x.learningPhase.conversions} conv.)` : "") : null
    };
  };
  ads.forEach(a => { a.setup = setup(AS[a.adsetId]); });
  const setupLine = st => st ? [st.objective, st.goal && "for " + st.goal.toLowerCase(), st.attribution, st.bid, st.learning].filter(Boolean).join(" · ") : "";
  const bp = Math.round(BUMP * 100);

  function classify() {
    ads.forEach(a => {
      a.zone = zoneAt(a.spend, a.k, T); a.zoneBumped = zoneAt(a.spend, a.k, T * (1 + BUMP));
      let act, sec;
      if (!a.live) { act = "Already off"; sec = "off"; }
      else if (a.zone === "scale") {
        sec = "scale";
        act = a.group === "eff" ? "Scale faster: +15–25% now" : a.group === "prec" ? "Scale +5–15%, watch CPA as spend climbs" : "Scale +5–15%";
      } else if (a.zone === "kill") {
        if (a.owner === "moshi") { act = "Check DM orders before cutting: Meta misses sales closed in chat"; sec = "dm"; }
        else if (a.group === "reach" && a.zoneBumped !== "kill") { act = `Give it room: judge at target +${bp}% for ~2 more weeks`; sec = "room"; }
        else { sec = "cut"; act = a.group === "reach" ? `Cut: a kill even at target +${bp}%` : a.group === "kc" ? "Cut now: pricey reach, high CPA" : a.k === 0 ? `Cut: no purchase after ${money(a.spend)}` : "Cut: CPA above target"; }
      } else { sec = "test"; act = a.group === "reach" ? "Keep testing: cheap reach, may close later" : "Keep testing"; }
      a.act = act; a.sec = sec;
    });
  }

  const W = 640, H = 480, L = 58, R = 14, TP = 16, B = 40;
  const yTicks = m => { const st = [10, 20, 25, 50, 100, 200, 250, 500, 1000].find(s => m / s <= 5) || 2000; const o = []; for (let v = 0; v <= m + 1e-9; v += st) o.push(v); return o; };
  const yTop = () => Math.max(2 * T, Math.min(2.2 * T, 1e9));

  function chart1() {
    const sp = ads.map(a => a.spend), xMin = Math.max(1, Math.min(...sp, 0.3 * T) / 1.3), xMax = Math.max(...sp, 45 * T) * 1.3;
    const yMax = yTop();
    const X = v => L + (Math.log(v) - Math.log(xMin)) / (Math.log(xMax) - Math.log(xMin)) * (W - L - R);
    const Y = v => TP + (1 - Math.min(v, yMax) / yMax) * (H - TP - B);
    const pts = q => { const out = []; for (let k = 1, x; (x = T * q(k)) < xMax * 1.5 && k < 1e6; k = k < 40 ? k + 1 : Math.ceil(k * 1.06)) if (x > xMin / 1.5) out.push([x, x / k]); return out; };
    const kp = pts(qK), spP = pts(qS);
    const path = ps => ps.map((p, i) => `${i ? "L" : "M"}${X(Math.max(p[0], xMin)).toFixed(1)},${Y(p[1]).toFixed(1)}`).join("");
    const kpath = path(kp), spath = path(spP);
    const k0 = X(Math.max(T * KILL[0], xMin)).toFixed(1);
    const kArea = kp.length ? `M${k0},${TP}L${X(kp[0][0]).toFixed(1)},${TP}${kpath.replace(/^M/, "L")}L${X(xMax)},${TP}Z` : "";
    const sArea = spP.length ? `${spath}L${X(spP[spP.length - 1][0]).toFixed(1)},${Y(0)}L${X(Math.max(spP[0][0], xMin)).toFixed(1)},${Y(0)}Z` : "";
    const xt = []; for (let e = Math.floor(Math.log10(xMin)); e <= Math.ceil(Math.log10(xMax)); e++) { const v = 10 ** e; if (v >= xMin && v <= xMax) xt.push(v); }
    const yt = yTicks(yMax);
    const order = { test: 0, kill: 1, scale: 2 };
    const dots = ads.slice().sort((a, b) => (b.live - a.live) * -1 || order[a.zone] - order[b.zone]).map(a => {
      const cx = X(a.spend), over = a.cpa == null || a.cpa > yMax, cy = over ? TP + 6 : Y(a.cpa), r = 3 + 3.5 * Math.sqrt(a.spend / Math.max(...sp));
      return `<g class="pt${pick === a.i ? " pk" : ""}" data-i="${a.i}">${over ? `<path class="dot ${a.zone}${a.live ? "" : " off"}" d="M${cx - 4.5},${cy + 4}L${cx + 4.5},${cy + 4}L${cx},${cy - 4}Z"/>` : `<circle class="dot ${a.zone}${a.live ? "" : " off"}" cx="${cx.toFixed(1)}" cy="${cy.toFixed(1)}" r="${r.toFixed(1)}"/>`}</g>`;
    }).join("");
    // Worked example: the same CPA (1.6x target) is still a test at 4x target spend and a kill at 40x.
    const ex = [["A", 4 * T], ["B", 40 * T]].map(([n, s]) => { const c = 1.6 * T, z = zoneAt(s, Math.floor(s / c), T); return { n, s, c, z, x: X(s), y: Y(c) }; });
    const rings = ex.map(e => `<circle class="ring" cx="${e.x}" cy="${e.y}" r="13"/><circle class="rb" cx="${e.x + 14}" cy="${e.y - 16}" r="9"/><text class="rt" x="${e.x + 14}" y="${e.y - 12}" text-anchor="middle">${e.n}</text>`).join("");
    const ty = Y(T), tl = `target ${money(T)}`, tw = tl.length * 7 + 18, tx = Math.min(W - R - tw - 4, X(Math.sqrt(xMin * xMax)));
    const pa = pick && byI[pick], plab = pa ? pickLabel(pa.cpa == null || pa.cpa > yMax ? TP + 6 : Y(pa.cpa), X(pa.spend)) : "";
    const svg = `<svg class="chart${pick ? " hp" : ""}" viewBox="0 0 ${W} ${H}" role="img" aria-label="Spend versus CPA with kill and scale curves">
      <defs><clipPath id="c1"><rect x="${L}" y="${TP}" width="${W - L - R}" height="${H - TP - B}"/></clipPath></defs>
      ${xt.map(v => `<line class="gr" x1="${X(v)}" x2="${X(v)}" y1="${TP}" y2="${H - B}"/><text x="${X(v)}" y="${H - B + 18}" text-anchor="middle">${kmoney(v)}</text>`).join("")}
      ${yt.map(v => `<line class="gr" x1="${L}" x2="${W - R}" y1="${Y(v)}" y2="${Y(v)}"/><text x="${L - 8}" y="${Y(v) + 4}" text-anchor="end">${money(v)}</text>`).join("")}
      <g clip-path="url(#c1)"><path class="kz" d="${kArea}"/><path class="sz" d="${sArea}"/><path class="kcv" d="${kpath}"/><path class="scv" d="${spath}"/></g>
      <text class="zl t" x="${L + 14}" y="${TP + 38}">TEST</text><text class="zs" x="${L + 14}" y="${TP + 56}">keep spending</text>
      <text class="zl k" x="${W - R - 10}" y="${TP + 38}" text-anchor="end">KILL</text><text class="zs" x="${W - R - 10}" y="${TP + 56}" text-anchor="end">90% sure it misses target</text>
      <text class="zl s" x="${W - R - 10}" y="${H - B - 48}" text-anchor="end">SCALE</text><text class="zs" x="${W - R - 10}" y="${H - B - 30}" text-anchor="end">90% sure it beats target</text>
      <line class="tgt" x1="${L}" x2="${W - R}" y1="${ty}" y2="${ty}"/>
      ${dots}${pick ? "" : rings}${plab}
      <rect class="tp" x="${tx}" y="${ty - 12}" width="${tw}" height="24" rx="12"/><text class="tpt" x="${tx + tw / 2}" y="${ty + 4}" text-anchor="middle">${esc(tl)}</text>
      <line class="ax" x1="${L}" x2="${L}" y1="${TP}" y2="${H - B}"/><line class="ax" x1="${L}" x2="${W - R}" y1="${H - B}" y2="${H - B}"/>
      <text x="14" y="${(TP + H - B) / 2}" transform="rotate(-90 14 ${(TP + H - B) / 2})" text-anchor="middle">CPA (ALL CUSTOMERS)</text></svg>`;
    const cap = `<div class="cap"><span>${ex.map(e => `<b>${e.n}</b> ${money(e.c)} at ${kmoney(e.s)}: ${e.z}`).join("&nbsp;&nbsp;&nbsp;")}</span><span>SPEND PER AD (LOG) →</span></div><div class="cap"><span>▲ at the top: no purchase yet, or CPA above ${money(yMax)}. Faded: paused or off.</span></div>`;
    return svg + cap;
  }

  function chart2() {
    if (grouped.length < 4) return `<p class="sub">Needs at least 4 ads with a purchase to split into groups; ${grouped.length} qualify.</p>`;
    const cs = grouped.map(a => a.cpmr).sort((a, b) => a - b), xMax = Math.max(mCpmr * 2.2, cs[Math.floor(cs.length * 0.97)] * 1.1);
    const yMax = yTop();
    const X = v => L + Math.min(v, xMax) / xMax * (W - L - R), Y = v => TP + (1 - Math.min(v, yMax) / yMax) * (H - TP - B);
    const rMax = Math.max(...grouped.map(a => a.reach)), rad = r => 3 + 26 * Math.sqrt(r / rMax);
    const xs = (() => { const st = [1, 2, 5, 10, 15, 20, 25, 50, 100].find(s => xMax / s <= 5) || 200, o = []; for (let v = 0; v <= xMax; v += st) o.push(v); return o; })();
    const mx = X(mCpmr), my = Y(mCpa);
    const quad = { reach: [L, TP, mx, my], kc: [mx, TP, W - R, my], eff: [L, my, mx, H - B], prec: [mx, my, W - R, H - B] };
    const fill = { eff: "oklch(.65 .15 150/.12)", reach: "oklch(.8 .12 75/.22)", prec: "oklch(.65 .12 265/.12)", kc: "oklch(.65 .17 25/.1)" };
    const areas = Object.entries(quad).map(([g, [x1, y1, x2, y2]]) => `<rect class="qa${sel === g ? " on" : ""}" x="${x1}" y="${y1}" width="${x2 - x1}" height="${y2 - y1}" style="fill:${fill[g]}"/>`).join("");
    const lab = (g, x, y, anchor) => { const w = Math.max(GROUP[g].length * 10.5, GSUB[g].length * 7.3) + 16, bx = anchor === "end" ? x - w + 8 : x - 8;
      return `<g class="ql ${g}${sel === g ? " on" : ""}"><rect class="qbg" x="${bx}" y="${y - 22}" width="${w}" height="46" rx="6"/><text class="zl" x="${x}" y="${y}" text-anchor="${anchor}">${GROUP[g].toUpperCase()}</text><text class="zs" x="${x}" y="${y + 17}" text-anchor="${anchor}">${GSUB[g]}</text></g>`; };
    const bubs = grouped.slice().sort((a, b) => b.reach - a.reach).map(a => `<g class="pt${pick === a.i ? " pk" : ""}" data-i="${a.i}"><circle class="bub ${a.group}${sel === a.group ? " on" : ""}${a.live ? "" : " off"}" cx="${X(a.cpmr).toFixed(1)}" cy="${Y(a.cpa).toFixed(1)}" r="${rad(a.reach).toFixed(1)}"/></g>`).join("");
    const pb = pick && byI[pick] && byI[pick].group ? byI[pick] : null, plab2 = pb ? pickLabel(Y(pb.cpa), X(pb.cpmr), rad(pb.reach)) : "";
    return `<svg class="chart${sel ? " sel" : ""}${pick ? " hp" : ""}" viewBox="0 0 ${W} ${H}" role="img" aria-label="CPMr versus CPA, bubbles sized by reach">
      ${areas}
      ${xs.map(v => `<line class="gr" x1="${X(v)}" x2="${X(v)}" y1="${TP}" y2="${H - B}"/><text x="${X(v)}" y="${H - B + 18}" text-anchor="middle">${money(v)}</text>`).join("")}
      ${yTicks(yMax).map(v => `<line class="gr" x1="${L}" x2="${W - R}" y1="${Y(v)}" y2="${Y(v)}"/><text x="${L - 8}" y="${Y(v) + 4}" text-anchor="end">${money(v)}</text>`).join("")}
      ${bubs}${plab2}
      <line class="med" x1="${mx}" x2="${mx}" y1="${TP}" y2="${H - B}"/><line class="med" x1="${L}" x2="${W - R}" y1="${my}" y2="${my}"/>
      <text x="${W - R - 4}" y="${my - 6}" text-anchor="end" style="fill:var(--text)">median ${money(mCpa)}</text><text x="${mx + 6}" y="${H - B - 8}" style="fill:var(--text)">median ${money(mCpmr)}</text>
      ${lab("reach", L + 16, TP + 36, "start")}${lab("kc", W - R - 16, TP + 36, "end")}${lab("eff", L + 16, H - B - 34, "start")}${lab("prec", W - R - 16, H - B - 34, "end")}
      <line class="ax" x1="${L}" x2="${L}" y1="${TP}" y2="${H - B}"/><line class="ax" x1="${L}" x2="${W - R}" y1="${H - B}" y2="${H - B}"/>
      <text x="14" y="${(TP + H - B) / 2}" transform="rotate(-90 14 ${(TP + H - B) / 2})" text-anchor="middle">CPA (ALL CUSTOMERS)</text></svg>
      <div class="cap"><span>← cheaper reach</span><span>CPMR: COST PER 1,000 REACHED →</span></div>`;
  }

  const byI = {}; ads.forEach(a => { byI[a.i] = a; });
  const mp = new RegExp("^" + String(D.merchant || "").replace(/[^a-z0-9]/gi, "[ _-]*") + "[ _·-]*", "i");
  const short = (n, m) => { const t = String(n || "").replace(mp, "").replace(/_{2,}/g, " · ").replace(/_/g, " ").replace(/\s+/g, " ").trim(); return t.length > m ? t.slice(0, m - 1) + "…" : t; };
  // Label the picked ad on the plot, flipping sides so it stays inside the chart.
  function pickLabel(y, x, r) {
    const a = byI[pick], t = short(a.name, 40), w = t.length * 6.9 + 16, right = x + (r || 7) + 8 + w < W - R;
    const bx = right ? x + (r || 7) + 8 : x - (r || 7) - 8 - w, by = Math.max(TP + 2, Math.min(H - B - 24, y - 12));
    return `<g class="plab" pointer-events="none"><rect x="${bx}" y="${by}" width="${w}" height="24" rx="6"/><text x="${bx + 8}" y="${by + 16}">${esc(t)}</text></g>`;
  }
  function detail() {
    if (!pick || !byI[pick]) return `<section class="card det empty"><p class="sub">Click any dot or bubble, or a row in the table below, to see which ad it is. The same ad lights up in both charts.</p></section>`;
    const a = byI[pick], st = a.setup, killAt = T * qK(a.k), scaleAt = a.k >= MIN_SCALE ? T * qS(a.k) : null;
    const why = a.zone === "kill" ? `With ${a.k} purchase${a.k === 1 ? "" : "s"}, an ad becomes a kill once it has spent ${money(killAt)} at a ${money(T)} target. This one has spent ${money(a.spend)}.`
      : a.zone === "scale" ? `With ${a.k} purchases, an ad is a scale while it has spent ${money(scaleAt)} or less at a ${money(T)} target. This one has spent ${money(a.spend)}.`
      : `With ${a.k} purchase${a.k === 1 ? "" : "s"}, it turns into a kill at ${money(killAt)} of spend${scaleAt ? ` and stays a scale only at ${money(scaleAt)} or less` : a.k < MIN_SCALE ? `; it needs ${MIN_SCALE} purchases before it can be a scale` : ""}. It has spent ${money(a.spend)}, so the evidence isn't in yet.`;
    const kv = (k, v) => `<div><small>${k}</small><b>${v}</b></div>`;
    return `<section class="card det"><div class="dh"><div><h3>${esc(a.name)}</h3><p class="sub">${esc(a.adset || "")}${a.campaign ? " · " + esc(a.campaign) : ""}${a.owner === "moshi" ? " · Moshi" : ""} · ${a.live ? "live" : "off (" + esc(String(a.status || "").toLowerCase()) + ")"}</p></div><button class="chip" id="unpick" aria-label="Clear selection">✕</button></div>
      <div class="kv">${kv("Spend", money(a.spend))}${kv("Purchases", a.k)}${kv("CPA", money(a.cpa))}${kv("CPMr", money(a.cpmr))}${kv("Reach", num(a.reach))}${kv("Zone", zp(a.zone))}${kv("Group", a.group ? GROUP[a.group] : "—")}</div>
      <p><b>${esc(a.act)}.</b> <span class="sub">${esc(why)}</span></p>${st ? `<p class="sub">Set up: ${esc(setupLine(st))}${st.budget ? " · " + esc(st.budget) : ""}</p>` : ""}</section>`;
  }

  const SECS = [
    ["cut", "Cut now", "rose", true], ["scale", "Scale", "mint", true], ["room", "Give it room", "acc", true],
    ["dm", "Check DM orders first", "acc", true], ["test", "Keep testing", "", false], ["off", "Already off", "", false]];
  const zp = z => `<span class="pill ${z === "scale" ? "mint" : z === "kill" ? "rose" : ""}">${z === "scale" ? "Scale" : z === "kill" ? "Kill" : "Test"}</span>`;
  function table() {
    return SECS.map(([key, title, tone, open]) => {
      const rs = ads.filter(a => a.sec === key).sort((a, b) => b.spend - a.spend);
      if (!rs.length) return "";
      const body = `<div class="tw"><table><thead><tr><th>Ad</th><th>Spend</th><th>Purch.</th><th>CPA</th><th>CPMr</th><th>Zone</th><th>Group</th><th>Do this</th></tr></thead><tbody>${rs.map(a => `<tr class="rp${a.live ? "" : " off"}${pick === a.i ? " pk" : ""}" data-r="${a.i}"><td class="nm">${esc(a.name)}<br><small>${esc(a.adset || a.campaign || "")}${a.owner === "moshi" ? " · Moshi" : ""}</small>${a.setup ? `<br><small class="su">${esc(setupLine(a.setup))}</small>` : ""}</td><td class="n">${money(a.spend)}</td><td class="n">${a.k}</td><td class="n">${money(a.cpa)}</td><td class="n">${money(a.cpmr)}</td><td>${zp(a.zone)}</td><td>${a.group ? esc(GROUP[a.group]) : "—"}</td><td><b>${esc(a.act)}</b></td></tr>`).join("")}</tbody></table></div>`;
      const sp = rs.reduce((s, a) => s + a.spend, 0);
      return `<details ${open || rs.some(a => a.i === pick) ? "open" : ""}><summary>${esc(title)} <span class="pill ${tone}">${rs.length} ads · ${money(sp)}</span></summary>${body}</details>`;
    }).join("");
  }

  function adsetTable() {
    if (!(D.adsets || []).length) return "";
    const by = {};
    ads.forEach(a => { const k = a.adsetId || a.adset; if (!k) return; (by[k] = by[k] || { id: a.adsetId, name: a.adset, owner: a.owner, ads: [] }).ads.push(a); });
    const rows = Object.values(by).map(g => { const x = AS[g.id] || {}; const sp = g.ads.reduce((s, a) => s + a.spend, 0), k = g.ads.reduce((s, a) => s + a.k, 0);
      return { ...g, x, st: setup(AS[g.id]) || {}, sp, k, owner: x.owner || g.owner, live: g.ads.some(a => a.live), z: z => g.ads.filter(a => a.live && a.zone === z).length }; })
      .sort((a, b) => (b.owner === "moshi") - (a.owner === "moshi") || b.sp - a.sp);
    const c = v => v ? esc(v) : `<span class="sub">not read</span>`;
    const body = rows.map(r => `<tr class="${r.live ? "" : "off"}${r.owner === "moshi" ? " mo" : ""}"><td class="nm">${esc(r.name || r.id)}${r.owner === "moshi" ? ` <span class="pill acc">Moshi</span>` : ""}<br><small>${esc(r.x.campaignName || "")}${r.x.effectiveStatus && r.x.effectiveStatus !== "ACTIVE" ? " · " + esc(title(r.x.effectiveStatus)) : ""}</small></td><td>${c(r.st.objective)}</td><td>${c(r.st.goal)}</td><td>${c(r.st.attribution)}</td><td>${c(r.st.bid)}</td><td>${c(r.st.budget)}</td><td>${c(r.st.learning)}</td><td class="n">${money(r.sp)}</td><td class="n">${money(r.k ? r.sp / r.k : null)}</td><td class="n"><span class="zs3"><b style="color:oklch(.55 .15 150)">${r.z("scale")}</b> / ${r.z("test")} / <b style="color:oklch(.58 .19 28)">${r.z("kill")}</b></span></td></tr>`).join("");
    return glass(`<div><h2>How each ad set is set up</h2><p class="sub">Objective, what Meta optimizes for, attribution window, bid strategy, budget and learning status, next to how the ad set's live ads score at the current target. Moshi ad sets first. Meta only returns delivery settings for Moshi ad sets and merchant ad sets it reports active, so "not read" means unknown, not "none".</p></div>
      <details open><summary>${rows.length} ad sets</summary><div class="tw"><table><thead><tr><th>Ad set</th><th>Objective</th><th>Optimized for</th><th>Attribution</th><th>Bid</th><th>Budget</th><th>Learning</th><th>Spend</th><th>CPA</th><th>Live ads S / T / K</th></tr></thead><tbody>${body}</tbody></table></div></details>`);
  }

  const glass = inner => `<section class="glass">${inner}</section>`;
  const srcLabel = () => T !== T0 ? `your what-if target (built with ${money(T0)})` : D.target.source === "merchant" ? "your target" : "account blended CPA, used as the target";
  const lo = Math.max(1, Math.round(T0 * 0.4)), hi = Math.round(T0 * 2.5);

  function render() {
    classify();
    const live = ads.filter(a => a.live), cnt = z => live.filter(a => a.zone === z).length, all = z => ads.filter(a => a.zone === z).length;
    const killSpend = live.filter(a => a.zone === "kill").reduce((s, a) => s + a.spend, 0);
    dyn.innerHTML = `
    <div class="tiles">
      <div class="card tile scale"><small>Scale zone</small><b>${cnt("scale")}</b><small>live ads, 90% sure they beat target</small></div>
      <div class="card tile"><small>Test zone</small><b>${cnt("test")}</b><small>live ads, keep spending and watch</small></div>
      <div class="card tile kill"><small>Kill zone</small><b>${cnt("kill")}</b><small>live ads, 90% sure they miss target</small></div>
      <div class="card tile"><small>Spend on live kill-zone ads</small><b>${money(killSpend)}</b><small>${allSpend ? Math.round(killSpend / allSpend * 100) : 0}% of all spend; ideally near zero</small></div>
    </div>
    <div class="charts">
      <section class="card cc"><h2><span class="badge">1</span>Scale &amp; Kill</h2><p class="sub">Each dot is an ad: spend (log) vs CPA. Curves are where we're 90% sure it beats or misses ${money(T)}, ${esc(srcLabel())}.</p>
        <div class="lg"><span><i style="background:oklch(.6 .15 150)"></i>Scale ${all("scale")}</span><span><i style="background:oklch(.68 .02 260)"></i>Test ${all("test")}</span><span><i style="background:oklch(.58 .19 28)"></i>Kill ${all("kill")}</span></div>${chart1()}</section>
      <section class="card cc"><h2><span class="badge">2</span>CPMr vs CPA</h2><p class="sub">Bubble = reach. Split at the account medians. Tap a group to isolate it.</p>
        <div class="lg chips2${sel ? " sel" : ""}">${["eff", "reach", "prec", "kc"].map(g => `<button class="chip${sel === g ? " on" : ""}" data-g="${g}"><i style="background:${{ eff: "oklch(.6 .15 150)", reach: "oklch(.72 .15 75)", prec: "oklch(.62 .12 265)", kc: "oklch(.62 .17 25)" }[g]}"></i>${GROUP[g]} ${grouped.filter(a => a.group === g).length}</button>`).join("")}</div>${chart2()}</section>
    </div>
    ${detail()}
    ${glass(`<div><h2>What to do with each ad</h2><p class="sub">Both charts read together. Raise budgets 5–15% at a time; efficient-growth winners can go faster. Reach plays in the kill zone get a target ${bp}% higher before they're cut, since cheap reach often buys journeys that close later.</p></div>${table()}`)}
    ${adsetTable()}
    ${(D.notes || []).length ? glass(`<h2>How to read these numbers</h2><ul class="l">${D.notes.map(n => `<li class="sub">${esc(n)}</li>`).join("")}</ul>`) : ""}
    <p class="sub">Read-only report. Nothing was paused or changed. Zones use a Bayesian test on purchase counts (Jeffreys prior, 90% threshold); a scale call also needs at least 3 purchases. Groups split at the medians of ads with at least one purchase (${grouped.length}).</p>`;
    document.getElementById("src").textContent = srcLabel();
    document.getElementById("rs").hidden = T === T0;
    app.querySelectorAll(".chip[data-g]").forEach(b => b.addEventListener("click", () => { sel = sel === b.dataset.g ? null : b.dataset.g; render(); }));
  }
  app.innerHTML = `    <div class="hd">${LOGO}<span class="mn">${esc(D.merchant)} × Moshi</span><div class="pl"><span class="pill">${esc(D.window.from)} → ${esc(D.window.to)}</span><span class="pill">${ads.length} ads · ${money(allSpend)}</span></div></div>
    <div class="hero"><h1>Scale or kill</h1><p class="dek">${esc(D.summary)}</p></div>
    <div class="card ctl"><label for="tn">Target CPA</label><input id="tn" type="number" min="1" step="1" value="${Math.round(T)}"><input id="tr" type="range" min="${lo}" max="${hi}" step="1" value="${Math.round(T)}" aria-label="Target CPA"><small id="src"></small><button id="rs" hidden>Reset to ${money(T0)}</button><input id="find" list="adl" placeholder="Find an ad by name" aria-label="Find an ad"><datalist id="adl">${ads.map(a => `<option value="${esc(a.name)}">`).join("")}</datalist></div><div id="tip" role="tooltip" hidden></div>
<div id="dyn" style="display:grid;gap:16px"></div>`;
  const dyn = document.getElementById("dyn"), tn = document.getElementById("tn"), tr = document.getElementById("tr"), tip = document.getElementById("tip");
  const setHash = () => { try { history.replaceState(null, "", pick ? "#ad=" + encodeURIComponent(byI[pick].id) : location.pathname + location.search); } catch (e) {} };
  const choose = (i, scrollTo) => { pick = pick === i && !scrollTo ? null : i; setHash(); tip.hidden = true; render(); const el = document.querySelector(scrollTo || ".det"); if (el && el.scrollIntoView) el.scrollIntoView({ behavior: "smooth", block: scrollTo ? "start" : "nearest" }); };
  dyn.addEventListener("click", e => {
    const p = e.target.closest && e.target.closest(".pt"); if (p) return choose(+p.dataset.i);
    const r = e.target.closest && e.target.closest("tr[data-r]"); if (r) return choose(+r.dataset.r, ".charts");
    if (e.target.closest && e.target.closest("#unpick")) { pick = null; setHash(); render(); }
  });
  dyn.addEventListener("mousemove", e => {
    const p = e.target.closest && e.target.closest(".pt"); if (!p) { tip.hidden = true; return; }
    const a = byI[+p.dataset.i]; if (!a) return;
    tip.innerHTML = `<b>${esc(short(a.name, 60))}</b><br>${money(a.spend)} spent · ${a.k} purchases · CPA ${money(a.cpa)} · CPMr ${money(a.cpmr)}<br>${a.zone[0].toUpperCase() + a.zone.slice(1)}${a.group ? " · " + GROUP[a.group] : ""}${a.live ? "" : " · off"} · <i>click for details</i>`;
    tip.hidden = false; const x = Math.min(e.clientX + 14, innerWidth - tip.offsetWidth - 8), y = e.clientY + 16 + tip.offsetHeight > innerHeight ? e.clientY - tip.offsetHeight - 10 : e.clientY + 16;
    tip.style.left = x + "px"; tip.style.top = y + "px";
  });
  dyn.addEventListener("mouseleave", () => { tip.hidden = true; });
  document.getElementById("find").addEventListener("change", e => { const a = ads.find(x => x.name === e.target.value); if (a) { e.target.value = ""; choose(a.i, ".charts"); } });
  const set = (v, from) => { v = Math.round(+v); if (v > 0 && isFinite(v)) { T = v; if (from !== tn) tn.value = v; if (from !== tr) tr.value = v; render(); } };
  tn.addEventListener("change", e => set(e.target.value, tn));
  tr.addEventListener("input", e => set(e.target.value, tr));
  document.getElementById("rs").addEventListener("click", () => set(T0));
  try { const m = /ad=([^&]+)/.exec(location.hash); const a0 = m && ads.find(x => String(x.id) === decodeURIComponent(m[1])); if (a0) pick = a0.i; } catch (e) {}
  render();
})();
</script>
</body>
</html>
