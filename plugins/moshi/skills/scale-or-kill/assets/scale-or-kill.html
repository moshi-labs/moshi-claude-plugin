<body>
<div class="mesh"></div>

<script>
const DATA = {
  merchant: "Example Co",
  date: "2026-11-02",
  window: { from: "2026-10-02", to: "2026-10-31" },
  currency: "USD",
  target: { cpa: 50, source: "merchant" },
  bumpPct: 15,
  summary: "Two ads have earned more budget and two should go today. Most of the account is still in test, so keep spending there and watch how each ad moves.",
  notes: [
    "CPA uses Meta-attributed purchases from all customers. Moshi can't split out new customers, so this is blended CPA, not new-customer CPA.",
    "Covers OUTCOME_SALES campaigns only. 1 lead-gen campaign (4 ads) left out."
  ],
  ads: [
    { id: "1", name: "Before/after UGC v1", campaign: "Prospecting | Broad", owner: "merchant", status: "ACTIVE", spend: 4200, reach: 61000, purchases: 120 },
    { id: "2", name: "Founder story 30s", campaign: "Prospecting | Broad", owner: "merchant", status: "ACTIVE", spend: 2600, reach: 52000, purchases: 65 },
    { id: "3", name: "Review static 3", campaign: "Prospecting | Broad", owner: "merchant", status: "ACTIVE", spend: 1900, reach: 21000, purchases: 30 },
    { id: "4", name: "Unboxing reel", campaign: "ASC", owner: "merchant", status: "ACTIVE", spend: 2100, reach: 70000, purchases: 38 },
    { id: "5", name: "Ingredient carousel", campaign: "ASC", owner: "merchant", status: "ACTIVE", spend: 1800, reach: 16000, purchases: 30 },
    { id: "6", name: "Meme static", campaign: "ASC", owner: "merchant", status: "ACTIVE", spend: 220, reach: 6100, purchases: 3 },
    { id: "7", name: "Moshi DM: Quiz", campaign: "Moshi DM", owner: "moshi", status: "ACTIVE", spend: 600, reach: 14000, purchases: 4 },
    { id: "8", name: "Lifestyle v4", campaign: "Prospecting | Broad", owner: "merchant", status: "ACTIVE", spend: 140, reach: 3000, purchases: 0 },
    { id: "9", name: "Creator try-on", campaign: "ASC", owner: "merchant", status: "ACTIVE", spend: 1100, reach: 50000, purchases: 16 },
    { id: "10", name: "Holiday teaser", campaign: "ASC", owner: "merchant", status: "PAUSED", spend: 300, reach: 5200, purchases: 1 }
  ]
};
</script>
<script>
(function () {
  const D = DATA, app = document.getElementById("app");
  const T = +D.target.cpa, BUMP = (+D.bumpPct || 15) / 100;
  const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  let fmt; try { fmt = new Intl.NumberFormat("en-US", { style: "currency", currency: D.currency || "USD", maximumFractionDigits: 0 }); } catch (e) { fmt = { format: v => Math.round(v) + " " + (D.currency || "") }; }
  const money = v => v == null || !isFinite(v) ? "—" : fmt.format(v);
  const num = v => Math.round(v).toLocaleString("en-US");

  // 10% / 90% quantiles of Gamma(k + 0.5, 1): the Jeffreys posterior on purchases-per-dollar x target CPA.
  // Kill when P(true CPA > target) >= 90%, i.e. spend/target >= KILL[k]. Scale when P(true CPA < target) >= 90%, i.e. spend/target <= SCALE[k].
  const SCALE = [0.008,0.292,0.805,1.417,2.084,2.789,3.521,4.273,5.043,5.825,6.62,7.424,8.237,9.057,9.884,10.717,11.555,12.398,13.246,14.098,14.954,15.813,16.675,17.541,18.409,19.28,20.154,21.03,21.908,22.788,23.671,24.555,25.441,26.329,27.219,28.11,29.003,29.897,30.793,31.69,32.588];
  const KILL = [1.353,3.126,4.618,6.009,7.342,8.638,9.906,11.154,12.385,13.602,14.808,16.003,17.191,18.371,19.544,20.711,21.873,23.029,24.182,25.33,26.474,27.615,28.753,29.887,31.019,32.148,33.274,34.398,35.52,36.639,37.757,38.873,39.987,41.099,42.209,43.318,44.425,45.531,46.635,47.738,48.84];
  const qS = k => k <= 40 ? SCALE[k] : k + 0.7 - 1.2816 * Math.sqrt(k + 0.5);
  const qK = k => k <= 40 ? KILL[k] : k + 0.7 + 1.2816 * Math.sqrt(k + 0.5);
  const zoneAt = (spend, k, t) => { const e = spend / t; return e >= qK(k) ? "kill" : (k > 0 && e <= qS(k)) ? "scale" : "test"; };

  const ads = (D.ads || []).filter(a => +a.spend > 0).map((a, i) => {
    const k = Math.max(0, Math.floor(+a.purchases || 0)), spend = +a.spend, reach = +a.reach || 0;
    return { ...a, i: i + 1, k, spend, reach, cpa: k > 0 ? spend / k : null, cpmr: reach > 0 ? spend / reach * 1000 : null,
      zone: zoneAt(spend, k, T), zoneBumped: zoneAt(spend, k, T * (1 + BUMP)), live: String(a.status || "").toUpperCase() === "ACTIVE" };
  });
  const median = xs => { const s = xs.slice().sort((a, b) => a - b), m = s.length >> 1; return s.length ? (s.length % 2 ? s[m] : (s[m - 1] + s[m]) / 2) : null; };
  const grouped = ads.filter(a => a.cpa != null && a.cpmr != null);
  const mCpmr = median(grouped.map(a => a.cpmr)), mCpa = median(grouped.map(a => a.cpa));
  const GROUP = { eff: "Efficient growth", reach: "Reach play", prec: "Precision", kc: "Kill candidate" };
  ads.forEach(a => {
    a.group = a.cpa == null || a.cpmr == null ? null : a.cpmr <= mCpmr ? (a.cpa <= mCpa ? "eff" : "reach") : (a.cpa <= mCpa ? "prec" : "kc");
    let act, rank;
    if (!a.live) { act = "Already off"; rank = 9; }
    else if (a.zone === "scale") {
      if (a.group === "eff") { act = "Scale faster: +15–25% now"; rank = 1; }
      else if (a.group === "prec") { act = "Scale +5–15%, watch CPA as spend climbs"; rank = 2; }
      else { act = "Scale +5–15%"; rank = 2; }
    } else if (a.zone === "kill") {
      if (a.owner === "moshi") { act = "Check DM orders before cutting: Meta misses sales closed in chat"; rank = 4; }
      else if (a.group === "reach") { act = a.zoneBumped === "kill" ? `Cut: a kill even at target +${D.bumpPct || 15}%` : `Give it room: judge at target +${D.bumpPct || 15}% for ~2 more weeks`; rank = a.zoneBumped === "kill" ? 0 : 3; }
      else if (a.group === "kc") { act = "Cut now"; rank = 0; }
      else if (a.k === 0) { act = `Cut: no purchase after ${money(a.spend)}`; rank = 0; }
      else { act = "Cut: CPA above target"; rank = 0; }
    } else { act = a.group === "reach" ? "Keep testing: cheap reach, may close later" : "Keep testing"; rank = 5; }
    a.act = act; a.rank = rank;
  });

  const live = ads.filter(a => a.live), cnt = z => live.filter(a => a.zone === z).length;
  const killSpend = live.filter(a => a.zone === "kill").reduce((s, a) => s + a.spend, 0), allSpend = ads.reduce((s, a) => s + a.spend, 0);

  // ---------- Chart 1: spend (log) vs CPA ----------
  function chart1() {
    const W = 820, H = 420, L = 62, R = 16, TP = 24, B = 44;
    const sp = ads.map(a => a.spend), xMin = Math.max(1, Math.min(...sp, 0.25 * T) / 1.4), xMax = Math.max(...sp, 4 * T) * 1.4;
    const yMax = Math.min(4 * T, Math.max(2 * T, ...ads.filter(a => a.cpa != null).map(a => a.cpa * 1.1)));
    const X = v => L + (Math.log(v) - Math.log(xMin)) / (Math.log(xMax) - Math.log(xMin)) * (W - L - R);
    const Y = v => TP + (1 - Math.min(v, yMax) / yMax) * (H - TP - B);
    const pts = (q) => { const out = []; for (let k = 1, x; (x = T * q(k)) < xMax * 1.5 && k < 100000; k = k < 40 ? k + 1 : Math.ceil(k * 1.08)) if (x > xMin / 1.5) out.push([x, x / k]); return out; };
    const kp = pts(qK).filter(p => p[1] <= yMax * 1.5), spP = pts(qS);
    const path = ps => ps.map((p, i) => `${i ? "L" : "M"}${X(Math.max(p[0], xMin)).toFixed(1)},${Y(p[1]).toFixed(1)}`).join("");
    const kpath = path(kp), spath = path(spP);
    const k0 = X(Math.max(T * KILL[0], xMin)).toFixed(1);
    const kArea = kp.length ? `M${k0},${Y(yMax)}L${k0},${TP + 14}L${X(kp[0][0]).toFixed(1)},${TP + 14}${kpath.replace(/^M/, "L")}L${X(kp[kp.length - 1][0]).toFixed(1)},${Y(yMax)}L${X(kp[0][0]).toFixed(1)},${Y(yMax)}Z` : "";
    const sArea = spP.length ? `${spath}L${X(spP[spP.length - 1][0]).toFixed(1)},${Y(0)}L${X(Math.max(spP[0][0], xMin)).toFixed(1)},${Y(0)}Z` : "";
    const ticks = []; for (let e = Math.floor(Math.log10(xMin)); e <= Math.ceil(Math.log10(xMax)); e++) [1, 2, 5].forEach(m => { const v = m * 10 ** e; if (v >= xMin && v <= xMax) ticks.push(v); });
    const yt = [0, 0.5, 1, 1.5, 2, 3, 4].map(m => m * T).filter(v => v <= yMax);
    const dots = ads.map(a => { const y = a.cpa == null ? TP + 4 : Y(a.cpa), cl = a.cpa == null || a.cpa > yMax;
      return `<g><title>#${a.i} ${esc(a.name)} · ${money(a.spend)} spent · ${a.k} purchases · CPA ${money(a.cpa)} · ${a.zone}</title>${cl ? `<path class="dot ${a.zone}${a.live ? "" : " off"}" d="M${X(a.spend) - 6},${y + 5}L${X(a.spend) + 6},${y + 5}L${X(a.spend)},${y - 5}Z"/>` : `<circle class="dot ${a.zone}${a.live ? "" : " off"}" cx="${X(a.spend).toFixed(1)}" cy="${y.toFixed(1)}" r="6"/>`}${ads.length <= 40 ? `<text x="${X(a.spend) + 8}" y="${y + 4}">${a.i}</text>` : ""}</g>`; }).join("");
    return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Spend versus CPA with kill and scale curves">
      <defs><clipPath id="c1"><rect x="${L}" y="${TP}" width="${W - L - R}" height="${H - TP - B}"/></clipPath></defs>
      <g clip-path="url(#c1)"><path class="kz" d="${kArea}"/><path class="sz" d="${sArea}"/></g>
      ${ticks.map(v => `<line class="gr" x1="${X(v)}" x2="${X(v)}" y1="${TP}" y2="${H - B}"/><text x="${X(v)}" y="${H - B + 16}" text-anchor="middle">${money(v)}</text>`).join("")}
      ${yt.map(v => `<line class="gr" x1="${L}" x2="${W - R}" y1="${Y(v)}" y2="${Y(v)}"/><text x="${L - 6}" y="${Y(v) + 4}" text-anchor="end">${money(v)}</text>`).join("")}
      <line class="tgt" x1="${L}" x2="${W - R}" y1="${Y(T)}" y2="${Y(T)}"/><text x="${W - R - 4}" y="${Y(T) - 5}" text-anchor="end">target ${money(T)}</text>
      <g clip-path="url(#c1)"><path class="kc" d="${kpath}"/><path class="sc" d="${spath}"/></g>
      <line class="ax" x1="${L}" x2="${L}" y1="${TP}" y2="${H - B}"/><line class="ax" x1="${L}" x2="${W - R}" y1="${H - B}" y2="${H - B}"/>
      <text x="${(L + W - R) / 2}" y="${H - 6}" text-anchor="middle">Spend (log scale)</text>
      <text x="14" y="${(TP + H - B) / 2}" transform="rotate(-90 14 ${(TP + H - B) / 2})" text-anchor="middle">CPA</text>
      <text x="${L + 6}" y="${TP + 14}">▲ no purchase yet, or CPA above ${money(yMax)}</text>
      ${dots}</svg>`;
  }

  // ---------- Chart 2: CPMr vs CPA ----------
  function chart2() {
    if (grouped.length < 4) return `<p class="sub">Needs at least 4 ads with a purchase and reach to split into groups; ${grouped.length} qualify.</p>`;
    const W = 820, H = 420, L = 62, R = 16, TP = 24, B = 44;
    const xMax = Math.max(...grouped.map(a => a.cpmr)) * 1.12, yMax = Math.min(Math.max(...grouped.map(a => a.cpa)) * 1.12, Math.max(4 * T, mCpa * 2.5));
    const X = v => L + v / xMax * (W - L - R), Y = v => TP + (1 - Math.min(v, yMax) / yMax) * (H - TP - B);
    const rMax = Math.max(...grouped.map(a => a.reach)), rad = r => 4 + 20 * Math.sqrt(r / rMax);
    const nice = (m, n) => { const s = 10 ** Math.floor(Math.log10(m / n)), f = [1, 2, 5, 10].find(f => m / (f * s) <= n) * s; const o = []; for (let v = 0; v <= m; v += f) o.push(v); return o; };
    const bubs = grouped.slice().sort((a, b) => b.reach - a.reach).map(a => `<g><title>#${a.i} ${esc(a.name)} · CPMr ${money(a.cpmr)} · CPA ${money(a.cpa)} · reach ${num(a.reach)} · ${GROUP[a.group]}</title><circle class="bub ${a.group}${a.live ? "" : " off"}" cx="${X(a.cpmr).toFixed(1)}" cy="${Y(a.cpa).toFixed(1)}" r="${rad(a.reach).toFixed(1)}"/>${grouped.length <= 40 ? `<text x="${X(a.cpmr)}" y="${Y(a.cpa) + 4}" text-anchor="middle" style="fill:var(--text);font-weight:600">${a.i}</text>` : ""}</g>`).join("");
    const mx = X(mCpmr), my = Y(mCpa);
    return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="CPMr versus CPA, bubbles sized by reach">
      ${nice(xMax, 6).map(v => `<line class="gr" x1="${X(v)}" x2="${X(v)}" y1="${TP}" y2="${H - B}"/><text x="${X(v)}" y="${H - B + 16}" text-anchor="middle">${money(v)}</text>`).join("")}
      ${nice(yMax, 6).map(v => `<line class="gr" x1="${L}" x2="${W - R}" y1="${Y(v)}" y2="${Y(v)}"/><text x="${L - 6}" y="${Y(v) + 4}" text-anchor="end">${money(v)}</text>`).join("")}
      <line class="med" x1="${mx}" x2="${mx}" y1="${TP}" y2="${H - B}"/><line class="med" x1="${L}" x2="${W - R}" y1="${my}" y2="${my}"/>
      <text class="ql" x="${L + 6}" y="${H - B - 8}">Efficient growth</text><text class="ql" x="${L + 6}" y="${TP + 14}">Reach play</text>
      <text class="ql" x="${W - R - 6}" y="${H - B - 8}" text-anchor="end">Precision</text><text class="ql" x="${W - R - 6}" y="${TP + 14}" text-anchor="end">Kill candidate</text>
      ${bubs}
      <line class="ax" x1="${L}" x2="${L}" y1="${TP}" y2="${H - B}"/><line class="ax" x1="${L}" x2="${W - R}" y1="${H - B}" y2="${H - B}"/>
      <text x="${(L + W - R) / 2}" y="${H - 6}" text-anchor="middle">CPMr: cost to reach 1,000 people (medians dashed: ${money(mCpmr)} CPMr, ${money(mCpa)} CPA)</text>
      <text x="14" y="${(TP + H - B) / 2}" transform="rotate(-90 14 ${(TP + H - B) / 2})" text-anchor="middle">CPA</text></svg>`;
  }

  const glass = inner => `<section class="glass">${inner}</section>`;
  const head = (h, sub) => `<div><h2>${esc(h)}</h2>${sub ? `<p class="sub">${esc(sub)}</p>` : ""}</div>`;
  const zp = z => `<span class="pill ${z === "scale" ? "mint" : z === "kill" ? "rose" : "acc"}">${z === "scale" ? "Scale" : z === "kill" ? "Kill" : "Test"}</span>`;
  const rows = ads.slice().sort((a, b) => a.rank - b.rank || b.spend - a.spend).map(a => `<tr class="${a.live ? "" : "off"}"><td class="n">${a.i}</td><td class="nm">${esc(a.name)}<br><small>${esc(a.campaign || "")}${a.owner === "moshi" ? " · Moshi" : ""}${a.live ? "" : " · " + esc(String(a.status || "").toLowerCase())}</small></td><td class="n">${money(a.spend)}</td><td class="n">${a.k}</td><td class="n">${money(a.cpa)}</td><td class="n">${money(a.cpmr)}</td><td>${zp(a.zone)}</td><td>${a.group ? esc(GROUP[a.group]) : "—"}</td><td class="act">${esc(a.act)}</td></tr>`).join("");
  const srcLabel = D.target.source === "merchant" ? "your target" : "account blended CPA, used as the target";

  app.innerHTML = `
    <div class="hd">${LOGO}<span class="mn">${esc(D.merchant)} × Moshi</span><div class="pl"><span class="pill">${esc(D.window.from)} → ${esc(D.window.to)}</span><span class="pill acc">Target CPA ${money(T)}</span></div></div>
    <div class="hero"><h1>Scale or kill</h1><p class="dek">${esc(D.summary)}</p></div>
    <div class="tiles">
      <div class="card tile scale"><small>Scale zone</small><b>${cnt("scale")}</b><small>live ads, 90% sure they beat target</small></div>
      <div class="card tile"><small>Test zone</small><b>${cnt("test")}</b><small>live ads, not enough evidence yet</small></div>
      <div class="card tile kill"><small>Kill zone</small><b>${cnt("kill")}</b><small>live ads, 90% sure they miss target</small></div>
      <div class="card tile"><small>Spend on live kill-zone ads</small><b>${money(killSpend)}</b><small>${allSpend ? Math.round(killSpend / allSpend * 100) : 0}% of ${money(allSpend)}; ideally near zero</small></div>
    </div>
    ${glass(`${head("1 · Scale & kill", `Each dot is an ad. Above the red curve we're 90% sure it won't reach ${money(T)} (${srcLabel}); below the green curve, 90% sure it beats it. The curves pinch toward target as spend grows.`)}${chart1()}
      <div class="lgd"><span><i style="background:var(--mint-strong)"></i>Scale</span><span><i style="background:var(--primary)"></i>Test</span><span><i style="background:var(--rose)"></i>Kill</span><span><i style="background:var(--text-2);opacity:.35"></i>Paused or off</span></div>`)}
    ${glass(`${head("2 · CPMr vs CPA", `Bubbles sized by reach, split at the account's medians into four groups. Only ads with at least one purchase are drawn${ads.length - grouped.length ? ` (${ads.length - grouped.length} left off)` : ""}.`)}${chart2()}
      <div class="lgd"><span><i style="background:var(--mint-strong)"></i>Efficient growth: cheap reach, low CPA</span><span><i style="background:var(--primary)"></i>Reach play: cheap reach, high CPA</span><span><i style="background:oklch(.7 .14 75)"></i>Precision: pricey reach, low CPA</span><span><i style="background:var(--rose)"></i>Kill candidate: pricey reach, high CPA</span></div>`)}
    ${glass(`${head("What to do with each ad", "Both charts read together. Raise budgets 5–15% at a time; efficient-growth winners can go faster. Reach plays in the kill zone get a raised target before they're cut, since cheap reach often buys journeys that close later.")}
      <div class="tw"><table><thead><tr><th>#</th><th>Ad</th><th>Spend</th><th>Purch.</th><th>CPA</th><th>CPMr</th><th>Zone</th><th>Group</th><th>Do this</th></tr></thead><tbody>${rows}</tbody></table></div>`)}
    ${(D.notes || []).length ? glass(`${head("How to read these numbers")}<ul class="l">${D.notes.map(n => `<li class="sub">${esc(n)}</li>`).join("")}</ul>`) : ""}
    <p class="sub">Read-only report. Nothing was paused or changed. Zones use a Bayesian test on purchase counts (Jeffreys prior, 90% threshold).</p>`;
})();
</script>
</body>
</html>
